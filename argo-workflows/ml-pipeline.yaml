apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: ml-pipeline-
  namespace: argo
spec:
  entrypoint: ml-pipeline
  arguments:
    parameters:
      - name: input_bucket
        value: "raw-data"
      - name: input_key
        value: "mobile_sales_data.csv"
      - name: output_bucket
        value: "processed-features"
      - name: features_key
        value: "features_latest.parquet" 

  templates:
    - name: ml-pipeline
      dag:
        tasks:
          # 1. Data Validation
          - name: data-validation
            template: data-validation
            arguments:
              parameters:
                - name: input_bucket
                  value: "{{workflow.parameters.input_bucket}}"
                - name: input_key
                  value: "{{workflow.parameters.input_key}}"

          # 2. Feature Engineering (runs after validation)
          - name: feature-engineering
            depends: data-validation
            template: feature-engineering
            arguments:
              parameters:
                - name: input_bucket
                  value: "{{workflow.parameters.input_bucket}}"
                - name: input_key
                  value: "{{workflow.parameters.input_key}}"
                - name: output_bucket
                  value: "{{workflow.parameters.output_bucket}}"

          # 3. Model Training (runs after feature engineering)
          - name: model-training
            depends: feature-engineering
            template: model-training
            arguments:
              parameters:
                - name: output_bucket
                  value: "{{workflow.parameters.output_bucket}}"
                - name: features_key
                  value: "{{tasks.feature-engineering.outputs.parameters.output-key}}"

    # ---------- TEMPLATE 1: Data Validation ----------
    - name: data-validation
      inputs:
        parameters:
          - name: input_bucket
          - name: input_key
      container:
        image: data-validation:v1
        imagePullPolicy: Never
        command: ["python", "validation.py"]
        env:
          - name: MLFLOW_S3_ENDPOINT_URL
            value: "http://mlminio.mldata.svc.cluster.local:9000"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: mlminio
                key: rootUser
                namespace: mldata
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: mlminio
                key: rootPassword
                namespace: mldata
          - name: INPUT_BUCKET
            value: "{{inputs.parameters.input_bucket}}"
          - name: INPUT_KEY
            value: "{{inputs.parameters.input_key}}"
      outputs:
        artifacts:
          - name: validation-report
            path: /tmp/validation_report.json

    # ---------- TEMPLATE 2: Feature Engineering ----------
    - name: feature-engineering
      inputs:
        parameters:
          - name: input_bucket
          - name: input_key
          - name: output_bucket
      container:
        image: feature-engineering:v4
        imagePullPolicy: Never
        command: ["python", "featurizer.py"]
        env:
          - name: MLFLOW_S3_ENDPOINT_URL
            value: "http://mlminio.mldata.svc.cluster.local:9000"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: mlminio
                key: rootUser
                namespace: mldata
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: mlminio
                key: rootPassword
                namespace: mldata
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow-mlflow.mldata.svc.cluster.local:5000"
          - name: INPUT_BUCKET
            value: "{{inputs.parameters.input_bucket}}"
          - name: INPUT_KEY
            value: "{{inputs.parameters.input_key}}"
          - name: OUTPUT_BUCKET
            value: "{{inputs.parameters.output_bucket}}"
      outputs:
        artifacts:
          - name: output-uri
            path: /tmp/output_uri.txt
        parameters:
          - name: output-key
            valueFrom:
              path: /tmp/output_key.txt  

    # ---------- TEMPLATE 3: Model Training ----------
    - name: model-training
      inputs:
        parameters:
          - name: output_bucket
          - name: features_key
      container:
        image: model-training:v1
        imagePullPolicy: Never
        command: ["python", "train.py"]
        env:
          - name: MLFLOW_S3_ENDPOINT_URL
            value: "http://mlminio.mldata.svc.cluster.local:9000"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: mlminio
                key: rootUser
                namespace: mldata
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: mlminio
                key: rootPassword
                namespace: mldata
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow-mlflow.mldata.svc.cluster.local:5000"
          - name: OUTPUT_BUCKET
            value: "{{inputs.parameters.output_bucket}}"
          - name: FEATURES_KEY
            value: "{{inputs.parameters.features_key}}"
      outputs:
        artifacts:
          - name: model-uri
            path: /tmp/model_uri.txt