#═══════════════════════════════════════════════════════════════════
# 1. MLflow Environment Variables (for backend and artifact store)
# ═══════════════════════════════════════════════════════════════════
mlflow:
  backendStoreUriFrom:
    secretKeyRef:
      name: mlflow-db-secret
      key: uri
  artifactsDestination: "s3://mlflow-artifacts/"
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          key: AWS_ACCESS_KEY_ID
          name: minio-credentials
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          key: AWS_SECRET_ACCESS_KEY
          name: minio-credentials
    - name: MLFLOW_S3_ENDPOINT_URL
      valueFrom:
        secretKeyRef:
          key: AWS_ENDPOINT_URL
          name: minio-credentials
    - name: AWS_REGION
      value: us-east-1

# ═══════════════════════════════════════════════════════════════════
# 2. Server Command-Line Arguments 
# ═══════════════════════════════════════════════════════════════════
server:
  value_options:
    host: "0.0.0.0"
    port: 5000
    workers: 1  
    allowed_hosts: "*" 
  flag_options: []

# ═══════════════════════════════════════════════════════════════════
# 3. Service
# ═══════════════════════════════════════════════════════════════════
service:
  type: ClusterIP
  port: 5000

# ═══════════════════════════════════════════════════════════════════
# 4. Storage & Ingress (disabled)
# ═══════════════════════════════════════════════════════════════════
storage:
  enabled: false
ingress:
  enabled: false

# ═══════════════════════════════════════════════════════════════════
# 5. Resources & Probes
# ═══════════════════════════════════════════════════════════════════
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 2Gi
    cpu: 1000m

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3