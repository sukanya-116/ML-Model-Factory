[project]
name = "model-evaluation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "polars==0.20.3",
    "boto3==1.34.0",
    "scikit-learn==1.4.0",
    "mlflow==2.11.0",
    "pandas==2.0.0",
    "numpy==1.24.0",
    "python-dotenv==1.2.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package-mode = false






